[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qt-modularizer"
version = "0.1.0"
description = "Companion tool for Qt Designer: semantic roles, design system themes and modular code generation."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Clement Daures" }]
dependencies = ["PySide6>=6.5", "typer>=0.9"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src", "external/daeria-log/src"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["src", "external/daeria-log/src"]
